<form [formGroup]="objectForm" (ngSubmit)="save()" autocomplete="off">
  <div class="modal-header">
    <h4 class="modal-title" id="modal-basic-title">{{getTitle()}}</h4>
    @if (object?.id) {
      <span class="badge bg-primary text-primary-text-contrast ms-2">ID: {{object.id}}</span>
    }
    <button type="button" [disabled]="!closeEnabled" class="btn-close" aria-label="Close" (click)="cancel()">
    </button>
  </div>
  <div class="modal-body">

    <div class="col">
      <pngx-input-text i18n-title title="Name" formControlName="name" [error]="error?.name" autocomplete="off"></pngx-input-text>
      <pngx-input-select i18n-title title="Matching algorithm" [items]="getMatchingAlgorithms()" formControlName="matching_algorithm"></pngx-input-select>
      @if (patternRequired) {
        <pngx-input-text i18n-title title="Matching pattern" formControlName="match" [error]="error?.match"></pngx-input-text>
        <pngx-input-check i18n-title title="Case insensitive" formControlName="is_insensitive"></pngx-input-check>
      }
      <pngx-input-select
        i18n-title
        title="Custom fields"
        [items]="customFields"
        formControlName="custom_fields"
        [multiple]="true"
        [allowNull]="true"></pngx-input-select>
      <pngx-input-check
        i18n-title
        title="Use for E-Rechnung imports"
        formControlName="enable_xrechnung_import"></pngx-input-check>
      @if (objectForm.get('enable_xrechnung_import').value) {
        <pngx-input-select
          i18n-title
          title="E-Rechnung correspondent field"
          [items]="xrechnungFieldOptions"
          formControlName="xrechnung_correspondent_field"
          [allowNull]="true"></pngx-input-select>
        <div class="mb-2">
          <div class="d-flex justify-content-between align-items-center">
            <label class="form-label mb-0" i18n>E-Rechnung custom field mappings</label>
            <div class="d-flex gap-2">
              @if (object?.id) {
                <button
                  type="button"
                  class="btn btn-sm btn-outline-secondary"
                  [disabled]="xrechnungActionRunning || networkActive"
                  (click)="applyXRechnungMappings()"
                  i18n>
                  Apply mappings to documents
                </button>
              }
              <button type="button" class="btn btn-sm btn-outline-primary" (click)="addXRechnungMapping()" i18n>Add mapping</button>
            </div>
          </div>
          <div formArrayName="xrechnung_custom_field_mappings" class="mt-2">
            @for (mapping of xrechnungMappings.controls; track mapping; let i = $index) {
              <div class="row g-2 mb-2" [formGroup]="xrechnungMappings.controls[i]">
                <div class="col-5">
                  <pngx-input-select
                    i18n-title
                    title="E-Rechnung field"
                    [items]="xrechnungFieldOptions"
                    formControlName="source"
                    [allowNull]="true"></pngx-input-select>
                </div>
                <div class="col-5">
                  <pngx-input-select
                    i18n-title
                    title="Custom field"
                    [items]="customFields"
                    formControlName="custom_field"
                    [allowNull]="true"></pngx-input-select>
                </div>
                <div class="col-2 d-flex align-items-end">
                  <button type="button" class="btn btn-outline-danger w-100" (click)="removeXRechnungMapping(i)" i18n>Delete</button>
                </div>
              </div>
            }
          </div>
        </div>
      }
    </div>

    <div *pngxIfOwner="object">
      <pngx-permissions-form [users]="users" accordion="true" formControlName="permissions_form"></pngx-permissions-form>
    </div>

  </div>
  <div class="modal-footer">
    <button type="button" class="btn btn-outline-secondary" (click)="cancel()" i18n [disabled]="networkActive">Cancel</button>
    <button type="submit" class="btn btn-primary" i18n [disabled]="networkActive">Save</button>
  </div>
</form>
